name: Track & publish Kalshi Golf site

# Self-contained golf pipeline: scrape the Kalshi PGA golf market(s), commit
# data changes, then publish the golf page to GitHub Pages — all WITHOUT running
# the NASCAR scraper. This decouples golf from the NASCAR workflow (track.yml):
# golf can go live any time, including between NASCAR race weekends when the
# NASCAR scraper has no open race to scrape.
#
# NASCAR IS NEVER OVERWRITTEN. GitHub Pages serves one site per repo, so the
# deploy below rebuilds the WHOLE site from committed files — NASCAR at the root
# (index.html + data/, exactly as last committed by track.yml) plus golf at
# /golf/. It only ever republishes NASCAR's existing content; it never scrapes
# or mutates it. track.yml still owns NASCAR's own refresh/publish.
#
# ON-DEMAND ONLY: runs on manual `workflow_dispatch` or a push to the golf page/
# scraper/this workflow — there is NO 15-min schedule. Kalshi is the only auto
# source for golf; other books are hand-entered. GitHub-hosted runners have open
# egress (Kalshi is reachable there but not from a Claude session, whose proxy
# blocks kalshi.com), so the scrape runs here.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/nascar-page-scraper-mwi55a]
    paths:
      - golf.html
      - golf_scraper.py
      - .github/workflows/golf.yml

concurrency:
  group: track-golf
  cancel-in-progress: false

permissions:
  contents: write        # commit scraped golf data back to the repo
  pages: write           # deploy to GitHub Pages
  id-token: write        # required by actions/deploy-pages

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run golf scraper
        env:
          KALSHI_TRADES_PER_MARKET: "50"
        run: python3 golf_scraper.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "No golf market changes; nothing to commit."
          else
            git commit -m "data(golf): market update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            pushed=false
            for i in 1 2 3 4; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
                echo "Pushed."; pushed=true; break
              fi
              echo "Push failed; retrying in $((2**i))s"; sleep $((2**i))
            done
            if [ "$pushed" != true ]; then echo "Failed to push after retries" >&2; exit 1; fi
          fi

      - name: Assemble site (NASCAR root preserved + golf at /golf/)
        run: |
          rm -rf _site && mkdir -p _site
          # NASCAR site, exactly as last committed — never scraped or altered here.
          if [ -f index.html ]; then cp index.html _site/; fi
          cp -r data _site/data
          rm -f _site/data/.gitkeep
          # Golf page at /golf/.
          mkdir -p _site/golf && cp golf.html _site/golf/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
