name: Track Kalshi NASCAR market

# Scrapes the Kalshi NASCAR race market, commits any changes back to the repo
# (git history == change log), then publishes the dashboard to GitHub Pages.
#
# NOTE: GitHub-hosted runners have unrestricted outbound internet, which is why
# the scrape runs here rather than inside a Claude Code session (whose egress
# proxy blocks kalshi.com).

on:
  # Auto-scrape is PAUSED between race weekends (race over + settled). The 15-min
  # poll below is disabled so the runner isn't scraping a resolved market.
  # Re-enable at start of a new race week (see CLAUDE.md kickoff).
  # schedule:
  #   # Every ~15 minutes, OFFSET off the top-of-hour minutes (GitHub throttles
  #   # crons at :00/:15/:30/:45), so :03/:18/:33/:48 runs more reliably.
  #   - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab
  push:
    # Redeploy the site when the page or scraper code changes. (Data commits
    # made by this workflow's bot token do NOT re-trigger it, so no loop.)
    branches: [claude/nascar-page-scraper-mwi55a]
    paths:
      - index.html
      - scraper.py
      - linewatch.py
      - .github/workflows/track.yml

# Prevent overlapping runs from racing on the same commit / deployment.
concurrency:
  group: track-kalshi
  cancel-in-progress: false

permissions:
  contents: write        # commit scraped data back to the repo
  pages: write           # deploy to GitHub Pages
  id-token: write        # required by actions/deploy-pages
  issues: write          # linewatch.py posts line-move alerts as PR/issue comments
  pull-requests: write   # (PR comments are issue comments on the PR)

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        id: scrape
        env:
          # Large-trade alerting for the Cup series (see alerts.py). Alert on any
          # single trade over this many dollars.
          ALERT_MIN_USD: "100"
          # Watch a deeper slice of recent trades per market so a big trade
          # between 15-min runs isn't missed.
          KALSHI_TRADES_PER_MARKET: "50"
          # Optional push channel. Add a repo secret named ALERT_WEBHOOK_URL
          # (Slack/Discord/Telegram/generic incoming webhook) to get pinged;
          # if unset, alerts still land in data/cup/ALERTS.md and the job summary.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 scraper.py

      - name: Kalshi line-move watch
        # Runs ONLY on a clean scrape: linewatch and the commit below touch the
        # freshly-written snapshots, so a failed/partial scrape must not reach
        # them — otherwise it could commit empty/half data and publish an
        # "awaiting first scrape" site. The publish steps further down still run
        # unconditionally, so data/roster/code changes deploy even when Kalshi 403s
        # (they republish the last-good committed tree, never a broken scrape).
        if: ${{ steps.scrape.outcome == 'success' }}
        # Diff each Cup market's YES price vs the committed baseline; on a move
        # >= WATCH_THRESH_PP (or the Cindric trip-wire) post a comment to the
        # watch PR so the subscribed Claude session wakes. No move -> no comment.
        # Runs after the scraper (fresh snapshots) and before the commit step so
        # the refreshed baseline it writes gets committed with the rest of data/.
        env:
          WATCH_THRESH_PP: "3"
          WATCH_PR_NUMBER: ${{ vars.WATCH_PR_NUMBER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 linewatch.py

      - name: Commit changes if any
        # Commit only fresh scraper output — never a failed/partial scrape.
        if: ${{ steps.scrape.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first so both modified and brand-new (untracked) files count,
          # then check the index for staged changes.
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "No market changes; nothing to commit."
          else
            git commit -m "data: market update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # Rebase in case a concurrent/previous run pushed first, then push.
            pushed=false
            for i in 1 2 3 4; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
                echo "Pushed."; pushed=true; break
              fi
              echo "Push failed; retrying in $((2**i))s"; sleep $((2**i))
            done
            if [ "$pushed" != true ]; then echo "Failed to push after retries" >&2; exit 1; fi
          fi

      - name: Assemble site
        if: ${{ !cancelled() }}
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html _site/
          cp -r data _site/data
          # Don't publish the internal marker file.
          rm -f _site/data/.gitkeep
          # Golf tracker: a separate site published at /golf/ that shares the
          # same data/ tree (Kalshi scraped on demand by golf.yml; other books
          # are hand-entered). NASCAR at the root is unaffected; this only adds
          # the /golf/ subtree.
          if [ -f golf.html ]; then mkdir -p _site/golf && cp golf.html _site/golf/index.html; fi

      - name: Configure Pages
        if: ${{ !cancelled() }}
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type = GitHub Actions) so no manual
          # Settings → Pages step is needed. Requires Pages to be available
          # for the repo (public repo, or private on a paid plan).
          enablement: true

      - name: Upload Pages artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: ${{ !cancelled() }}
        id: deploy
        uses: actions/deploy-pages@v4
