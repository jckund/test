name: Probe Kalshi trades endpoint

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 probe_activity.py
      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/probe_activity.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore: trades probe output"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
