name: FanDuel reachability probe

# TEMPORARY feasibility probe. Checks candidate paid/freemium odds APIs for
# NASCAR + FanDuel coverage and whether they offer a self-serve free key.
# Read-only. Delete this workflow once we know.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/reference-external-resource-apvomh]
    paths: [.github/workflows/fd-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Survey odds-API providers for NASCAR coverage
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64)"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, (e.read().decode("utf-8", "replace")[:400] if e.fp else "")
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"

          KW = ["nascar", "motorsport", "motor racing", "auto racing", "fanduel",
                "free trial", "free tier", "sign up", "get api key", "pricing"]

          targets = [
              ("SportsGameOdds docs",     "https://sportsgameodds.com/docs/"),
              ("SportsGameOdds leagues",  "https://sportsgameodds.com/docs/data/leagues/"),
              ("SportsGameOdds /sports",  "https://api.sportsgameodds.com/v2/sports/"),
              ("OpticOdds site",          "https://opticodds.com/"),
              ("OpticOdds dev reference", "https://developer.opticodds.com/reference/getting-started"),
              ("OpticOdds /sports",       "https://api.opticodds.com/api/v3/sports"),
              ("OddsJam API page",        "https://oddsjam.com/odds-api"),
              ("OddsBlaze sports",        "https://data.oddsblaze.com/v1/sports"),
          ]
          for label, url in targets:
              st, body = get(url)
              blow = (body or "").lower()
              hits = [k for k in KW if k in blow]
              print(f"\n### {label}\n  {url}\n  status={st} len={len(body) if body else 0}")
              print("  keywords:", ", ".join(hits) if hits else "(none)")
              # show a snippet around 'nascar' if present
              i = blow.find("nascar")
              if i >= 0:
                  print("  nascar ctx:", (body[max(0,i-70):i+70]).replace("\n"," "))
          PY
