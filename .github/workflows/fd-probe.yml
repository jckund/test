name: FanDuel reachability probe

# TEMPORARY. Captures FanDuel's own content-managed-page response bodies and digs
# out the NASCAR winner market + JSON shape. Delete after.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/reference-external-resource-apvomh]
    paths: [.github/workflows/fd-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture + dissect FanDuel market JSON
        run: |
          node - <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36",
              locale: "en-US", timezoneId: "America/New_York",
            });
            const p = await ctx.newPage();
            const bodies = [];
            p.on("response", async (r) => {
              const u = r.url();
              if (/content-managed-page|getMarketPrices/.test(u)) {
                try { bodies.push({ url: u, json: await r.json() }); } catch {}
              }
            });
            await p.goto("https://sportsbook.fanduel.com/motorsport", { waitUntil: "networkidle", timeout: 60000 }).catch(()=>{});
            await p.waitForTimeout(6000);
            console.log("captured bodies:", bodies.length);

            // Merge all attachments.
            const events = {}, markets = {};
            for (const bod of bodies) {
              const att = (bod.json && bod.json.attachments) || {};
              Object.assign(events, att.events || {});
              Object.assign(markets, att.markets || {});
            }
            console.log("merged events:", Object.keys(events).length, "markets:", Object.keys(markets).length);

            console.log("\n=== NASCAR-ish events ===");
            for (const [id, e] of Object.entries(events))
              if (/nascar|cup|quaker|xfinity|truck|race/i.test(e.name||"")) console.log("  ", id, "|", e.name);

            // Distinct market names to understand vocabulary.
            const names = {};
            for (const m of Object.values(markets)) { const n=m.marketName||m.marketType||"?"; names[n]=(names[n]||0)+1; }
            console.log("\n=== market names (top) ===");
            Object.entries(names).sort((a,b)=>b[1]-a[1]).slice(0,25).forEach(([n,c])=>console.log(`  ${c}  ${n}`));

            // Find a winner-ish market and dump its full shape + runner shape.
            let target=null;
            for (const m of Object.values(markets)) {
              if (/winner|to win|outright/i.test(m.marketName||m.marketType||"")) { target=m; break; }
            }
            if (target) {
              console.log("\n=== TARGET winner market ===");
              console.log("marketName:", target.marketName, "| marketType:", target.marketType, "| runners:", (target.runners||[]).length);
              const {runners, ...meta} = target;
              console.log("market meta keys:", Object.keys(meta));
              console.log("SAMPLE RUNNER:\n", JSON.stringify((runners||[])[0], null, 1).slice(0,900));
              console.log("\nALL RUNNERS (name | odds):");
              for (const r of (runners||[])) {
                const o = r.winRunnerOdds && (r.winRunnerOdds.americanDisplayOdds||{}).americanOdds;
                console.log("   ", (r.runnerName||"?").padEnd(24), o||"?");
              }
            } else {
              console.log("\nno winner market; dumping one sample market:");
              console.log(JSON.stringify(Object.values(markets)[0], null, 1).slice(0,1500));
            }
            await b.close();
          })().catch(e => { console.error("FATAL", e); process.exit(1); });
          JS
