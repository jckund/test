name: FanDuel reachability probe

# TEMPORARY feasibility probe. Confirms whether SportsGameOdds (free tier) covers
# NASCAR, and inspects its leagues catalog. Read-only. Delete once we know.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/reference-external-resource-apvomh]
    paths: [.github/workflows/fd-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm SportsGameOdds NASCAR coverage
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64)"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, (e.read().decode("utf-8", "replace")[:600] if e.fp else "")
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"

          # Grep the full docs bundle for any motorsport signal.
          st, body = get("https://sportsgameodds.com/docs/")
          print("docs status", st, "len", len(body) if body else 0)
          if body:
              for kw in ("nascar", "motor", "racing", "formula", "f1", "indycar", "auto_racing"):
                  idxs = [m.start() for m in re.finditer(kw, body.lower())][:3]
                  if idxs:
                      print(f"  '{kw}' x{len(idxs)}:")
                      for i in idxs:
                          print("     ...", body[max(0,i-50):i+50].replace("\n"," "))
                  else:
                      print(f"  '{kw}': not found")

          # Try public leagues/sports catalog endpoints (may need a key).
          for url in ("https://api.sportsgameodds.com/v2/leagues/",
                      "https://api.sportsgameodds.com/v2/sports/",
                      "https://sportsgameodds.com/docs/data/leagues",
                      "https://sportsgameodds.com/docs/guides/leagues"):
              st, body = get(url)
              b = (body or "").lower()
              print(f"\n{url}\n  status={st} len={len(body) if body else 0} "
                    f"nascar={'Y' if 'nascar' in b else 'n'} motor={'Y' if 'motor' in b else 'n'}")
              print("  ", (body or "")[:200].replace("\n", " "))
          PY
