name: FanDuel reachability probe

# TEMPORARY. Extracts the NASCAR race-winner odds from FanDuel via headless
# browser and prints the JSON shape so we can write the real parser. Delete after.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/reference-external-resource-apvomh]
    paths: [.github/workflows/fd-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        run: |
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Extract NASCAR winner odds
        run: |
          node - <<'JS'
          const { chromium } = require("playwright");
          const AK = "FhMFpcPWXMeyZxOx";
          const API = `https://api.sportsbook.fanduel.com/sbapi/content-managed-page?page=SPORT&eventTypeId=8&_ak=${AK}&timezone=America/New_York`;
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36",
              locale: "en-US", timezoneId: "America/New_York",
            });
            const p = await ctx.newPage();
            // Visit the page first so PerimeterX sets its clearance cookies.
            await p.goto("https://sportsbook.fanduel.com/motorsport", { waitUntil: "domcontentloaded", timeout: 60000 }).catch(()=>{});
            await p.waitForTimeout(5000);
            // Now fetch the API JSON from within the page context (carries cookies).
            const data = await p.evaluate(async (url) => {
              const r = await fetch(url, { headers: { "Accept": "application/json" } });
              return { status: r.status, json: await r.json().catch(() => null) };
            }, API);
            console.log("API status:", data.status);
            const j = data.json;
            if (!j) { console.log("no json"); await b.close(); return; }
            console.log("top-level keys:", Object.keys(j));
            const att = j.attachments || {};
            const events = att.events || {};
            const markets = att.markets || {};
            console.log("events:", Object.keys(events).length, "markets:", Object.keys(markets).length);

            // List events mentioning NASCAR / Cup.
            console.log("\n=== events (name / eventTypeId) ===");
            for (const [id, e] of Object.entries(events)) {
              if (/nascar|cup|quaker|race/i.test(e.name || "")) console.log(" ", id, "|", e.name);
            }
            // Find markets that look like the outright race winner + dump runners+odds.
            console.log("\n=== candidate winner markets ===");
            let shown = 0;
            for (const [id, m] of Object.entries(markets)) {
              const nm = m.marketName || m.marketType || "";
              if (!/winner|to win|outright/i.test(nm)) continue;
              const ev = events[m.eventId];
              if (ev && !/nascar|cup|quaker|race/i.test(ev.name || "")) continue;
              console.log(`\n[market ${id}] "${nm}"  event="${ev ? ev.name : m.eventId}"  runners=${(m.runners||[]).length}`);
              for (const r of (m.runners || []).slice(0, 6)) {
                const o = r.winRunnerOdds && r.winRunnerOdds.americanDisplayOdds;
                console.log("    -", r.runnerName, "|", o ? o.americanOdds : JSON.stringify(Object.keys(r)));
              }
              if (++shown >= 3) break;
            }
            if (!shown) {
              // Show the shape of one arbitrary market so we can see field names.
              const first = Object.values(markets)[0];
              console.log("\nno winner market matched; sample market shape:");
              console.log(JSON.stringify(first, null, 1).slice(0, 1200));
            }
            await b.close();
          })().catch(e => { console.error("FATAL", e); process.exit(1); });
          JS
