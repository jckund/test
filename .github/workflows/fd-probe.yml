name: FanDuel reachability probe

# TEMPORARY feasibility probe. Checks whether The Odds API lists NASCAR (and any
# motorsport) coverage, so we know if the licensed-API path is viable before
# signing up for a key. Read-only. Delete this workflow once we know.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/reference-external-resource-apvomh]
    paths: [.github/workflows/fd-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check The Odds API sports coverage
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          def get(url, label, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:500]
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"

          # 1) Public docs coverage page — grep for motorsport / nascar keys.
          st, body = get("https://the-odds-api.com/sports-odds-data/sports-apis.html",
                         "docs", {"User-Agent": "Mozilla/5.0"})
          print("DOCS PAGE:", st, "len", len(body) if body else 0)
          if body:
              low = body.lower()
              for kw in ("nascar", "motor", "racing", "formula", "motogp", "indycar"):
                  i = low.find(kw)
                  print(f"  '{kw}': {'FOUND @'+str(i) if i>=0 else 'not found'}")
                  # print a little context around first hit
                  if i >= 0:
                      print("     ...", body[max(0,i-60):i+60].replace("\n"," "))

          # 2) /v4/sports without key — shows the error shape (confirms API is reachable).
          st, body = get("https://api.the-odds-api.com/v4/sports/?all=true",
                         "sports", {"User-Agent": "Mozilla/5.0"})
          print("\nV4 SPORTS (no key):", st)
          print(" ", (body or "")[:300])
          PY
