name: FanDuel reachability probe

# TEMPORARY feasibility probe. Renders FanDuel's motorsport page with a headless
# browser on the runner and captures the API calls it makes, to discover the
# real odds endpoint. Read-only. Delete this workflow once we know the answer.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/reference-external-resource-apvomh]
    paths: [.github/workflows/fd-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        run: |
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture FanDuel network calls
        run: |
          node - <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36",
              locale: "en-US",
              timezoneId: "America/New_York",
            });
            const p = await ctx.newPage();
            const apiHits = [];
            p.on("response", async (r) => {
              const u = r.url();
              if (/sbapi|content-managed|event|market|api/.test(u)) {
                const ct = r.headers()["content-type"] || "";
                apiHits.push({ status: r.status(), ct: ct.slice(0, 40), url: u.slice(0, 160) });
              }
            });
            try {
              await p.goto("https://sportsbook.fanduel.com/motorsport", { waitUntil: "networkidle", timeout: 60000 });
            } catch (e) { console.log("nav note:", e.message); }
            await p.waitForTimeout(6000);

            const title = await p.title();
            const bodyText = (await p.evaluate(() => document.body.innerText || "")).slice(0, 600);
            console.log("TITLE:", title);
            console.log("VISIBLE TEXT (first 600):\n", bodyText.replace(/\n{2,}/g, "\n"));
            console.log("\n=== JSON API responses ===");
            const seen = new Set();
            for (const h of apiHits) {
              if (!h.ct.includes("json")) continue;
              const key = h.url.split("?")[0];
              if (seen.has(key)) continue; seen.add(key);
              console.log(`[${h.status}] ${h.ct}  ${h.url}`);
            }
            console.log("\ntotal api-ish responses:", apiHits.length);
            await b.close();
          })().catch(e => { console.error("FATAL", e); process.exit(1); });
          JS
