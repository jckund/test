name: Track FanDuel NASCAR odds

# Scrapes FanDuel's NASCAR race markets (via headless browser, since FanDuel has
# no public API and blocks plain HTTP) and commits data/odds.json. The
# Kalshi workflow (track.yml) publishes the site on its own schedule and copies
# the whole data/ dir, so these odds reach the dashboard within ~15 min.
#
# Runs hourly rather than every 15 min: FanDuel odds move slower than the Kalshi
# order book, the browser job is heavier, and a lighter touch is more polite to
# FanDuel. Data commits here don't match track.yml's path filter, so there is no
# deploy loop.

on:
  # Hourly auto-scrape (re-enabled 2026-10-30; was paused 2026-08-09).
  schedule:
    - cron: "17 * * * *"   # hourly, offset from Kalshi's */15
  workflow_dispatch: {}
  push:
    # Re-scrape when the scraper or workflow changes on the deploy branch.
    branches: [claude/nascar-page-scraper-mwi55a]
    paths:
      - fanduel_scraper.js
      - .github/workflows/fanduel.yml

concurrency:
  group: track-fanduel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape gate
        # Scheduled runs and dispatches (the hourly cron-job.org pinger) obey the
        # same race-week switch as track.yml (.github/scrape_active == "true");
        # off => instant green no-op. Only a code push always scrapes.
        id: gate
        run: |
          active="$(tr -d '[:space:]' < .github/scrape_active 2>/dev/null || echo false)"
          [ "$active" = "true" ] || [ "${{ github.event_name }}" = "push" ] && active=true || active=false
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Scrape gate: active=$active (event=${{ github.event_name }})"

      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.active == 'true' }}
        with:
          node-version: "22"

      - name: Install Playwright + Chromium
        if: ${{ steps.gate.outputs.active == 'true' }}
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Scrape FanDuel
        if: ${{ steps.gate.outputs.active == 'true' }}
        run: node fanduel_scraper.js

      - name: Commit changes if any
        if: ${{ steps.gate.outputs.active == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "No FanDuel odds changes; nothing to commit."
          else
            git commit -m "data(fanduel): odds update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            pushed=false
            for i in 1 2 3 4; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
                echo "Pushed."; pushed=true; break
              fi
              echo "Push failed; retrying in $((2**i))s"; sleep $((2**i))
            done
            if [ "$pushed" != true ]; then echo "Failed to push after retries" >&2; exit 1; fi
          fi
