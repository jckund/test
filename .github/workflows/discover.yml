name: Discover Kalshi NASCAR events (one-off)

# Temporary dry-run: checks out the dev branch, runs the new multi-series
# scraper against live Kalshi, and prints the resulting data tree + samples so
# we can validate the namespaced output before wiring the dashboard. Does NOT
# commit or deploy. Safe to delete after.

on:
  workflow_dispatch: {}

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/reference-external-resource-apvomh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scraper (dry run, no commit)
        run: |
          rm -rf data
          python3 scraper.py
          echo "======== data tree ========"
          find data -maxdepth 3 -type f | sort
          echo "======== data/series.json ========"
          cat data/series.json
          for s in cup truck xfinity; do
            if [ -f "data/$s/index.json" ]; then
              echo "======== data/$s/index.json ========"
              cat "data/$s/index.json"
              echo "======== data/$s/winner snapshot summary ========"
              python3 -c "import json;d=json.load(open('data/$s/winner/snapshot.json'));print('title:',d['event'].get('title'));print('market_count:',d['market_count'])" 2>/dev/null || echo "(no winner snapshot)"
            fi
          done
