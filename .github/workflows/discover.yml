name: Discover NASCAR race events

# One-shot helper: enumerate all Kalshi events for this race so we know the
# top-3/5/10/20 event tickers. Run manually; safe to delete afterwards.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 discover.py
      - name: Commit discovery output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/discovery.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: discovery output"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
