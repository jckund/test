name: Caliber location discovery (one-time probe)

# Runs the Playwright discovery probe on a runner (open egress) and commits the
# findings under data/caliber/_discovery/ so they can be read from a dev session
# (which cannot reach caliber.com). Manual dispatch only. Safe to delete this
# workflow + caliber_discover.mjs once caliber_scraper.py is finalized.

on:
  workflow_dispatch: {}
  # workflow_dispatch/schedule only fire from the default branch, so while this
  # lives on the feature branch we trigger the probe by pushing the probe files.
  push:
    branches: [claude/location-scraper-weekly-email-2wu2yc]
    paths:
      - caliber_discover.mjs
      - .github/workflows/caliber_discover.yml

concurrency:
  group: caliber-discover
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run discovery probe
        run: node caliber_discover.mjs

      - name: Commit discovery output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/caliber/_discovery
          if git diff --cached --quiet; then
            echo "No discovery output to commit."
          else
            git commit -m "chore(caliber): discovery probe output"
            for i in 1 2 3 4; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
                echo "Pushed."; break
              fi
              echo "Push failed; retrying in $((2**i))s"; sleep $((2**i))
            done
          fi
