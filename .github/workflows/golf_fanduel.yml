name: Track FanDuel Golf odds

# Scrapes FanDuel's golf markets (headless browser, since FanDuel has no public
# API and blocks plain HTTP) for the tracked tournament(s) and commits
# data/<key>/fanduel/odds.json. track.yml publishes the site on its own schedule
# and copies the whole data/ dir, so these odds reach /golf/ within ~15 min.
#
# Runs hourly (offset from the Kalshi scrape): FanDuel odds move slower than the
# order book, the browser job is heavier, and a lighter touch is more polite.
# Data commits here don't match track.yml's path filter, so there is no deploy
# loop.

on:
  schedule:
    - cron: "37 * * * *"   # hourly, offset from Kalshi's */15 and FanDuel NASCAR's :17
  workflow_dispatch: {}
  push:
    branches: [claude/nascar-page-scraper-mwi55a]
    paths:
      - fanduel_golf.js
      - .github/workflows/golf_fanduel.yml

concurrency:
  group: track-golf-fanduel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Scrape FanDuel golf
        run: node fanduel_golf.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "No FanDuel golf odds changes; nothing to commit."
          else
            git commit -m "data(golf-fanduel): odds update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            pushed=false
            for i in 1 2 3 4; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
                echo "Pushed."; pushed=true; break
              fi
              echo "Push failed; retrying in $((2**i))s"; sleep $((2**i))
            done
            if [ "$pushed" != true ]; then echo "Failed to push after retries" >&2; exit 1; fi
          fi
